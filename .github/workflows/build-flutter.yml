name: Build Flutter APK (Fallback Worker)

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Job ID from Bot'
        required: true
      userId:
        description: 'User ID'
        required: true
      payload:
        description: 'Build Payload (JSON)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter (Latest Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Project & Patch Constraints
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo '${{ github.event.inputs.payload }}' > payload.json

          ASSET_URL=$(jq -r '.zipAssetUrl // .url // empty' payload.json)

          if [ -z "$ASSET_URL" ]; then
            echo "::error::Tidak ada zipAssetUrl atau url di payload."
            exit 1
          fi

          rm -rf project project.zip
          mkdir -p project

          if [[ "$ASSET_URL" == *"api.github.com"* ]]; then
            curl -fL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -o project.zip \
              "$ASSET_URL"
          else
            curl -fL -o project.zip "$ASSET_URL"
          fi

          unzip -q project.zip -d project

          PUBSPEC=$(find project -maxdepth 5 -type f -name pubspec.yaml | head -n 1)
          if [ -z "$PUBSPEC" ]; then
            echo "::error::pubspec.yaml tidak ditemukan di dalam ZIP."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$PUBSPEC")
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          # 1. Hapus pubspec.lock agar tidak bentrok dengan cache lama
          rm -f "$PROJECT_ROOT/pubspec.lock"

          # 2. Patch HANYA environment.sdk menggunakan Node.js (Aman & Presisi)
          node -e '
            const fs = require("fs");
            const file = process.argv[1];
            let content = fs.readFileSync(file, "utf8");
            
            // Mengubah sdk hanya yang berada di bawah section environment
            content = content.replace(/(environment\s*:\s*\n\s*sdk\s*:\s*)[^\n]+/g, "$1\">=3.0.0 <4.0.0\"");
            
            fs.writeFileSync(file, content);
          ' "$PUBSPEC"

          echo "Updated pubspec.yaml environment:"
          grep -A 3 "environment:" "$PUBSPEC" || true

      - name: Build APK
        run: |
          set -e
          cd "$PROJECT_ROOT"
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Locate APK
        run: |
          set -e
          APK_PATH=$(find "$PROJECT_ROOT" -type f -name "app-release.apk" -path "*/flutter-apk/*" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::app-release.apk tidak ditemukan setelah build."
            find "$PROJECT_ROOT/build" -maxdepth 5 2>/dev/null || true
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.jobId }}
          path: ${{ env.APK_PATH }}
